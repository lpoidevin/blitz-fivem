---
# System defaults
cfx_server_user: citizenfx
cfx_server_group: citizenfx
cfx_server_home_dir: /var/opt/cfx
cfx_server_sftp_chrooted: false
cfx_server_sftp_keys: []

# Directories
cfx_server_install_dir: /opt/cfx
cfx_server_data_dir: "{{ cfx_server_home_dir }}/txData"
cfx_server_data_dir_mode: "0750"

# Database defaults
cfx_server_db_host: localhost
cfx_server_db_port: 3306
cfx_server_db_user: citizenfx

# Provider defaults
cfx_server_provider_name: DefaultHosting
