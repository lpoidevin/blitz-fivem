server {
	# listen 80 default_server;
	listen [::]:80 default_server;

	server_name _;

	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	location / {
		return 308 https://$host$request_uri;
	}
}

server {
	# listen 443 ssl default_server;
	listen [::]:443 ssl default_server;

	server_name _;

	include snippets/snakeoil.conf;

	return 444;
}
