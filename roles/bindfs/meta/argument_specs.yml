# SPDX-License-Identifier: MIT
---
argument_specs:
  main:
    short_description: Deploy bindfs configuration using pam_mount.
    options:
      bindfs_path:
        type: str
        required: true
        description: The location of the mounted volume.
      bindfs_mountpoint:
        type: str
        required: true
        description: The destination directory onto which the volume is mounted.
      bindfs_target_user:
        type: str
        required: true
        description: Owner of new files and directories in the mounted path.
      bindfs_target_group:
        type: str
        required: true
        description: Owning group of new files and directories in the mounted path.
      bindfs_selected_group:
        type: str
        required: true
        description: Group for which the logging-in user's membership is verified
