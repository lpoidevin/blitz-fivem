---
# Enable connection to mariadb via TCP tunnel
sshd_global_config:
  AllowTcpForwarding: "yes"

# Enable secure file transfer on production servers
sshd_match_blocks:
  - condition: User citizenfx
    rules:
      ChrootDirectory: "%h"
      ForceCommand: internal-sftp -u 0022 -l VERBOSE
      AllowAgentForwarding: "no"
      AllowTcpForwarding: "no"
      X11Forwarding: "no"
      PermitTTY: "no"
